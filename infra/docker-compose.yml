services:
  postgres:
    image: postgres:15
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: trustmarket
      POSTGRES_PASSWORD: trustmarket
      POSTGRES_DB: trustmarket
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ../services/api
    environment:
      DATABASE_URL: postgresql+psycopg://trustmarket:trustmarket@postgres:5432/trustmarket
      REDIS_URL: redis://redis:6379/0
      SQLALCHEMY_POOL_SIZE: "10"
      SQLALCHEMY_MAX_OVERFLOW: "10"
      SQLALCHEMY_POOL_TIMEOUT: "30"
      SQLALCHEMY_POOL_RECYCLE: "1800"
      LISTINGS_CACHE_ENABLED: "true"
      LISTINGS_CACHE_TTL_SECONDS: "20"
      UVICORN_WORKERS: "4"
      JWT_SECRET: change-me
      JWT_REFRESH_SECRET: change-me-refresh
      ACCESS_TOKEN_TTL_MINUTES: "30"
      REFRESH_TOKEN_TTL_DAYS: "14"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: trustmarket
      MINIO_SECURE: "false"
      PUBLIC_API_URL: http://localhost:8080
      APP_ENV: development
      STALE_DAYS: "30"
      CONFIRM_WINDOW_DAYS: "7"
      CITY_LOCK: ISTANBUL
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.25
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - minio
    ports:
      - "8080:80"

volumes:
  pgdata:
  miniodata:
