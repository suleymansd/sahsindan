worker_processes auto;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  gzip on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types application/json application/javascript text/plain text/css application/xml image/svg+xml;

  upstream api_upstream {
    server api:8000;
    keepalive 64;
  }

  server {
    listen 80;
    client_max_body_size 10m;

    location /api/ {
      proxy_pass http://api_upstream/api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Origin $http_origin;
      proxy_connect_timeout 3s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_buffering on;
      proxy_buffers 16 16k;
      proxy_busy_buffers_size 64k;
      
      # Pass through CORS headers from backend
      proxy_pass_header Access-Control-Allow-Origin;
      proxy_pass_header Access-Control-Allow-Credentials;
      proxy_pass_header Access-Control-Allow-Methods;
      proxy_pass_header Access-Control-Allow-Headers;
    }

    location /storage/trustmarket/listings/ {
      proxy_pass http://minio:9000/trustmarket/listings/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /storage/ {
      return 404;
    }
  }
}
