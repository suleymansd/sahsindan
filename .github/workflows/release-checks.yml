name: Release checks (manual)
# An operator starts this workflow after checking the account's CI budget.
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: python -m unittest discover -s scripts -p test_ios_release.py
      - run: ruff check --select F,E9 app tests scripts alembic
        working-directory: services/api
      - run: pytest --postgres-url postgresql+psycopg://ci:disposable-ci-password@localhost:5432/ci --cov=app --cov-fail-under=75
        working-directory: services/api
        env: {REDIS_TEST_BINARY: /usr/bin/redis-server}
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:unit && npm run lint && npm run typecheck && npm run test:e2e
        working-directory: apps/web
        env: {API_PYTHON: python, NEXT_TELEMETRY_DISABLED: '1'}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web
      - run: pip-audit -r requirements.txt
        working-directory: services/api
      - run: docker build -f services/api/Dockerfile services/api && docker build -f apps/web/Dockerfile apps/web
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.1', channel: stable}
      - run: cp .env.example .env && flutter pub get && flutter analyze lib test integration_test && flutter test
        working-directory: apps/mobile
